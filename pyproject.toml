[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowcv"
version = "0.1.0"
description = "Snow Clearance CV - dataset tooling"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
proto = ["opencv-python-headless>=4.8", "scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
snowcv = "snowcv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snowcv.core" = ["resources/*.yaml", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
